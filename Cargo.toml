[package]
name = "flaker"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Interactive TUI manager for NixOS Flakes"
repository = "https://github.com/tw1xale/flaker"
readme = "README.md"
keywords = ["nixos", "nix", "flake", "tui", "ratatui"]
categories = ["command-line-utilities"]

[[bin]]
name = "flaker"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
tui-input = "0.10"
whoami = "1"
catppuccin = "2.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
unicode-width = "0.2"
unicode-segmentation = "1.13"
rnix = "0.14"
rowan = "0.16"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
strip = true
panic = "abort" 
