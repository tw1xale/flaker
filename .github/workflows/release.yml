name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build Standalone Musl Binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package Binary & Checksums
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/flaker dist/flaker-x86_64-linux
          chmod +x dist/flaker-x86_64-linux
          tar -czf dist/flaker-x86_64-linux.tar.gz -C dist flaker-x86_64-linux
          cd dist && sha256sum flaker-x86_64-linux flaker-x86_64-linux.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/flaker-x86_64-linux.tar.gz
            dist/flaker-x86_64-linux
            dist/SHA256SUMS
          generate_release_notes: true
